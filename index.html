<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Fan Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; padding: 1.5rem; color: #1a1a1a; }
.dash { max-width: 680px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 3px; }
.week-sub { font-size: 13px; color: #aaa; }
.updated { font-size: 11px; color: #aaa; margin-top: 2px; }

.filters { display: flex; flex-wrap: wrap; gap: 7px; margin: 1rem 0; padding-bottom: 1rem; border-bottom: 1px solid #ebebeb; }
.filter-btn { font-size: 12px; padding: 5px 13px; border-radius: 999px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; transition: all 0.15s; }
.filter-btn.active { background: #e8f0fe; color: #1a56db; border-color: transparent; }
.filter-btn:hover:not(.active) { background: #f0f0f0; }

.tabs { display: flex; margin-bottom: 1.25rem; border-bottom: 1px solid #ebebeb; }
.tab { font-size: 13px; padding: 8px 16px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.tab.active { color: #1a56db; border-bottom-color: #1a56db; }

.section-hdr { font-size: 11px; font-weight: 600; color: #777; text-transform: uppercase; letter-spacing: 0.07em; margin: 1.5rem 0 0.5rem; padding-bottom: 4px; border-bottom: 1px solid #ebebeb; }
.day-label { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.07em; margin: 1rem 0 0.5rem; }

.game-card { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: #fff; border: 1px solid #ebebeb; border-radius: 10px; margin-bottom: 8px; transition: box-shadow 0.15s; }
.game-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.game-card.dim { opacity: 0.42; }

.team-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
.badge-lakers  { background: #5B2582; color: #F0B429; }
.badge-dodgers { background: #005A9C; color: #ffffff; }
.badge-madrid  { background: #FEBE10; color: #00529F; }
.badge-nycfc   { background: #6CACE4; color: #003087; }
.badge-acfc    { background: #F05A28; color: #ffffff; }
.badge-ucla    { background: #2D68C4; color: #FFD100; }
.badge-usc     { background: #990000; color: #FFC72C; }
.badge-ucdavis { background: #022851; color: #DAAA00; }

.game-info { flex: 1; min-width: 0; }
.gtitle { font-size: 13px; font-weight: 500; }
.gmeta { font-size: 12px; color: #777; margin-top: 2px; }
.gnote { font-size: 11px; color: #aaa; margin-top: 2px; font-style: italic; }
.gright { text-align: right; flex-shrink: 0; }
.gtime { font-size: 12px; font-weight: 500; }
.gtv { font-size: 11px; color: #aaa; margin-top: 2px; }

.pill { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 999px; margin-left: 5px; vertical-align: middle; }
.pill-home { background: #dcfce7; color: #166534; }
.pill-away { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }

.news-sec { margin-bottom: 1.5rem; }
.news-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 0.6rem; }
.news-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
.news-src { font-size: 12px; font-weight: 600; color: #444; }
.news-item { padding: 9px 12px; background: #fff; border: 1px solid #ebebeb; border-radius: 8px; margin-bottom: 6px; }
.news-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.news-title { font-size: 13px; font-weight: 500; color: #1a1a1a; line-height: 1.4; flex: 1; }
.news-link { font-size: 11px; color: #1a56db; text-decoration: none; flex-shrink: 0; padding: 3px 8px; border-radius: 6px; border: 1px solid #e8f0fe; white-space: nowrap; }
.news-link:hover { background: #e8f0fe; }
.news-date { font-size: 11px; color: #aaa; margin-top: 4px; }

.no-games { padding: 2rem; text-align: center; color: #aaa; font-size: 13px; }
@media (max-width: 480px) { body { padding: 1rem; } .filter-btn { font-size: 11px; padding: 4px 10px; } }
</style>
</head>
<body>
<div class="dash">

  <h1>My Fan Dashboard</h1>
  <div class="week-sub">Auto-updates weekly</div>
  <div class="updated" id="updated"></div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-t="all">All</button>
    <button class="filter-btn" data-t="lakers">Lakers</button>
    <button class="filter-btn" data-t="dodgers">Dodgers</button>
    <button class="filter-btn" data-t="madrid">Real Madrid</button>
    <button class="filter-btn" data-t="nycfc">NYCFC</button>
    <button class="filter-btn" data-t="acfc">Angel City</button>
    <button class="filter-btn" data-t="ucla">UCLA</button>
    <button class="filter-btn" data-t="usc">USC</button>
    <button class="filter-btn" data-t="ucdavis">UC Davis</button>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="schedule">Schedule</div>
    <div class="tab" data-tab="news">News</div>
  </div>

  <div id="sched-panel"><div id="sched"></div></div>
  <div id="news-panel" style="display:none"></div>
</div>

<script>

// =======================================================
//  APP LOGIC — No need to edit below here
// =======================================================
const PRO_IDS     = new Set(Object.keys(TEAMS).filter(k => TEAMS[k].pro));
const COLLEGE_IDS = new Set(Object.keys(TEAMS).filter(k => TEAMS[k].college));
let activeT = 'all', activeTab = 'schedule';

function pill(cls, text) { return '<span class="pill '+cls+'">'+text+'</span>'; }

function card(g) {
  const t = TEAMS[g.team] || {};
  const cls = g.dim ? ' dim' : '';
  const pills = g.dim ? '' : pill(g.home?'pill-home':'pill-away', g.home?'Home':'Away');
  return '<div class="game-card'+cls+'">'
    +'<div class="team-badge '+(t.badge||'')+'">'+(t.label||'?')+'</div>'
    +'<div class="game-info">'
      +'<div class="gtitle">'+g.title+pills+'</div>'
      +'<div class="gmeta">'+g.meta+'</div>'
      +(g.note?'<div class="gnote">'+g.note+'</div>':'')
    +'</div>'
    +'<div class="gright"><div class="gtime">'+g.time+'</div>'+(g.tv?'<div class="gtv">'+g.tv+'</div>':'')+'</div>'
    +'</div>';
}

function renderSched() {
  const c = document.getElementById('sched');
  const games = SCHEDULE.filter(g => activeT==='all' || g.team===activeT);
  let html = '';
  const proGames = games.filter(g => PRO_IDS.has(g.team));
  const colGames = games.filter(g => COLLEGE_IDS.has(g.team));

  if (proGames.length) {
    if (activeT==='all') html += '<div class="section-hdr">Pro sports</div>';
    [...new Set(proGames.map(g=>g.day))].forEach(d => {
      html += '<div class="day-label">'+d+'</div>';
      proGames.filter(g=>g.day===d).forEach(g => { html += card(g); });
    });
  }
  if (colGames.length) {
    if (activeT==='all') html += '<div class="section-hdr" style="margin-top:1.5rem">College sports</div>';
    const active = colGames.filter(g=>!g.dim), inactive = colGames.filter(g=>g.dim);
    if (active.length) {
      [...new Set(active.map(g=>g.day))].forEach(d => {
        html += '<div class="day-label">'+d+'</div>';
        active.filter(g=>g.day===d).forEach(g => { html += card(g); });
      });
    }
    if (inactive.length) {
      html += '<div class="day-label" style="margin-top:1rem">Off-season</div>';
      inactive.forEach(g => { html += card(g); });
    }
  }
  c.innerHTML = html || '<div class="no-games">No games for this team this week.</div>';
}

function renderNews() {
  const panel = document.getElementById('news-panel');
  const order = Object.keys(TEAMS);
  const keys = activeT==='all' ? order : [activeT];
  let html = '';

  keys.forEach(k => {
    const t = TEAMS[k];
    const n = NEWS[k];
    if (!t || !n) return;
    html += '<div class="news-sec">'
      +'<div class="news-hdr">'
        +'<div class="team-badge news-badge '+t.badge+'">'+t.label+'</div>'
        +'<span class="news-src">'+n.src+'</span>'
      +'</div>';
    n.items.forEach(item => {
      html += '<div class="news-item">'
        +'<div class="news-top">'
          +'<div class="news-title">'+item.title+'</div>'
          +'<a class="news-link" href="'+item.url+'" target="_blank" rel="noopener">Open ↗</a>'
        +'</div>'
        +(item.date ? '<div class="news-date">'+item.date+' · '+n.src+'</div>' : '')
      +'</div>';
    });
    html += '</div>';
  });

  panel.innerHTML = html || '<div class="no-games">No news fetched yet. Run the workflow to populate.</div>';
}

document.getElementById('updated').textContent = 'Schedule updated: ' + LAST_UPDATED;

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn'); if (!btn) return;
  activeT = btn.dataset.t;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab==='schedule' ? renderSched() : renderNews();
});

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab'); if (!tab) return;
  activeTab = tab.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('sched-panel').style.display = activeTab==='schedule' ? '' : 'none';
  document.getElementById('news-panel').style.display  = activeTab==='news'     ? '' : 'none';
  if (activeTab==='news') renderNews();
});

renderSched();
</script>

</html>
